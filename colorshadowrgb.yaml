# Example device config for the rctestflight Color Shadow lamp. Everything
# about the lamp lives in package.yaml; this file holds only the name, the
# secrets and the package include. Pin colorshadowrgb_ref to a commit for
# repeatable builds; it pins both the package and its C++ component.
esphome:
  name: "colorshadowrgb"
  friendly_name: ColorShadowRGB

substitutions:
  colorshadowrgb_ref: main

packages:
  colorshadowrgb:
    url: https://github.com/xav-ie/ESPHome-ColorShadowRGB
    ref: ${colorshadowrgb_ref}
    files: [package.yaml]

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "ColorShadowRGB Fallback Hotspot"
    password: !secret ap_password
