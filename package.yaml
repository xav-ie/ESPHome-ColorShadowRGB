# Hardware and behaviour of the rctestflight Color Shadow lamp (ESP32-C3).
# Include it as an ESPHome package from a device config that sets the name,
# api, ota and wifi (see colorshadowrgb.yaml). Override any substitution below
# from the device config.
substitutions:
  # Which GPIO drives which LED (verified on a lamp), and which knob reads
  # which ADC pin.
  red_pin: GPIO7
  green_pin: GPIO6
  blue_pin: GPIO5
  red_knob_pin: GPIO4
  green_knob_pin: GPIO3
  blue_knob_pin: GPIO0
  button_pin: GPIO9

  # No thermal shutdown here (stock firmware stops at 63°C and defaults to
  # 50%); the base is the only heatsink, so cap each channel.
  led_max_power: 60%
  # Lowest duty at which an LED visibly lights. Any level above zero starts
  # here, and zero still means off.
  led_min_power: 0.4%

  # Knob ADC voltage at the zero end and at the full end of its travel.
  # Readings at or below knob_raw_zero are off.
  knob_raw_zero: "0.02"
  knob_raw_full: "0.85"
  # A resting knob only takes over the light once it moves this far (0 to 1)
  # within knob_settle_ms; slower drift and noise are ignored.
  knob_turn_threshold: "0.04"
  # While turning, changes this small still follow the knob.
  knob_follow_step: "0.01"
  # A turn ends after this long without movement.
  knob_settle_ms: "1000"

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  logs:
    # The knobs are sampled 25 times a second; keep their readings out of the log.
    sensor: INFO

captive_portal:

web_server:
  port: 80
  version: 3

binary_sensor:
  - platform: gpio
    pin:
      number: ${button_pin}
      inverted: true
    id: button
    internal: true
    filters:
      - delayed_on_off: 10ms
    on_click:
      - min_length: 50ms
        max_length: 600ms
        then:
          - light.toggle: rgb_led
    on_multi_click:
      # Fires while still held, so the effect changes without letting go.
      - timing:
          - ON for at least 800ms
        then:
          - lambda: |-
              // Step to the effect after the one running now (None, pulse,
              // random, flicker, then None again). From off, start at the first.
              auto *light = id(rgb_led);
              uint32_t next = 1;
              if (light->remote_values.is_on())
                next = (light->get_current_effect_index() + 1) % (light->get_effect_count() + 1);
              light->turn_on().set_effect(next).perform();

sensor:
  - platform: adc
    pin: ${red_knob_pin}
    id: red_knob
    internal: true
    update_interval: 40ms
    samples: 4
    filters: &knob_filters
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      # 0 to 1 across the knob's travel, with a flat zero at the off end.
      - lambda: |-
          return clamp((x - ${knob_raw_zero}f) / (${knob_raw_full}f - ${knob_raw_zero}f), 0.0f, 1.0f);
  - platform: adc
    pin: ${green_knob_pin}
    id: green_knob
    internal: true
    update_interval: 40ms
    samples: 4
    filters: *knob_filters
  - platform: adc
    pin: ${blue_knob_pin}
    id: blue_knob
    internal: true
    update_interval: 40ms
    samples: 4
    filters: *knob_filters

interval:
  - interval: 40ms
    then:
      - lambda: |-
          // The knobs set each LED's absolute level. They only drive the light
          // during a deliberate turn, so whatever set the light last (a knob,
          // the button or Home Assistant) stays until the next deliberate input.
          static bool ready = false;
          static bool turning = false;
          static float anchor[3];
          static float sent[3];
          static uint32_t anchor_ms = 0;
          static uint32_t moved_ms = 0;
          static LightColorValues written;

          const float knob[3] = {id(red_knob).state, id(green_knob).state, id(blue_knob).state};
          for (float k : knob)
            if (std::isnan(k))
              return;
          const uint32_t now = millis();
          auto *light = id(rgb_led);

          auto rest = [&]() {
            turning = false;
            anchor_ms = now;
            for (int i = 0; i < 3; i++)
              anchor[i] = knob[i];
          };
          // At boot the light keeps its restored state; the knobs wait to be turned.
          if (!ready) {
            ready = true;
            rest();
            return;
          }
          // Something else changed the light mid turn; it wins until the knobs move again.
          if (turning && light->remote_values != written)
            rest();

          bool moved = false;
          for (int i = 0; i < 3; i++) {
            if (turning)
              moved |= fabsf(knob[i] - sent[i]) >= ${knob_follow_step}f;
            else
              moved |= fabsf(knob[i] - anchor[i]) >= ${knob_turn_threshold}f;
          }
          if (!moved) {
            // Re-anchor at rest, so slow drift never adds up to a turn.
            if (now - (turning ? moved_ms : anchor_ms) >= ${knob_settle_ms})
              rest();
            return;
          }
          turning = true;
          moved_ms = now;
          for (int i = 0; i < 3; i++)
            sent[i] = knob[i];

          // An effect would keep overriding the knobs, so stop it first.
          if (light->get_current_effect_index() != 0)
            light->make_call().set_effect(uint32_t{0}).perform();

          // RGB lights keep the brightest channel at 100% and carry the overall
          // level as brightness, so split the three absolute levels that way.
          const float level = std::max({knob[0], knob[1], knob[2]});
          auto call = level > 0.0f ? light->turn_on() : light->turn_off();
          call.set_transition_length(0);
          if (level > 0.0f) {
            call.set_rgb(knob[0] / level, knob[1] / level, knob[2] / level);
            call.set_brightness(level);
          }
          call.perform();
          written = light->remote_values;

light:
  - platform: rgb
    name: "light"
    id: rgb_led
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - pulse:
      - random:
      - flicker:

output:
  - platform: ledc
    id: output_red
    pin: ${red_pin}
    frequency: 1220Hz
    min_power: ${led_min_power}
    max_power: ${led_max_power}
    zero_means_zero: true
  - platform: ledc
    id: output_green
    pin: ${green_pin}
    frequency: 1220Hz
    min_power: ${led_min_power}
    max_power: ${led_max_power}
    zero_means_zero: true
  - platform: ledc
    id: output_blue
    pin: ${blue_pin}
    frequency: 1220Hz
    min_power: ${led_min_power}
    max_power: ${led_max_power}
    zero_means_zero: true
